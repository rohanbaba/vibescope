<title>VibeScope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed top bar, resizable left tree of sessions and tests, main workspace with tabs. Engineering-console look: cool graphite neutrals, cobalt accent, mono for numbers. */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f6f7fa; --line:#d6dae3; --line2:#e6e9ef;
  --fg:#17202b; --fg2:#4b5563; --fg3:#7b8594;
  --accent:#1f56d6; --accent-fg:#ffffff; --accent-soft:#e3ebfb;
  --good:#1a8a4a; --warn:#b26a00; --bad:#c62828; --good-soft:#e2f3e8; --warn-soft:#fbefd6; --bad-soft:#fbe3e3;
  --plot-bg:#ffffff; --plot-grid:#e4e7ee; --plot-fg:#17202b;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:6px; --shadow:0 1px 2px rgba(20,30,50,.08),0 4px 14px rgba(20,30,50,.06);
  --sidebar-w:300px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a1f27; --surface2:#20262f; --line:#2f3741; --line2:#272e38;
  --fg:#e6e9ee; --fg2:#aab2bf; --fg3:#7d8794;
  --accent:#6f95ff; --accent-fg:#0d1526; --accent-soft:#1f2b48;
  --good:#4cc47c; --warn:#e3a53a; --bad:#ef6a6a; --good-soft:#15301f; --warn-soft:#3a2d12; --bad-soft:#3b1b1b;
  --plot-bg:#1a1f27; --plot-grid:#2c343f; --plot-fg:#e6e9ee;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a1f27; --surface2:#20262f; --line:#2f3741; --line2:#272e38;
  --fg:#e6e9ee; --fg2:#aab2bf; --fg3:#7d8794;
  --accent:#6f95ff; --accent-fg:#0d1526; --accent-soft:#1f2b48;
  --good:#4cc47c; --warn:#e3a53a; --bad:#ef6a6a; --good-soft:#15301f; --warn-soft:#3a2d12; --bad-soft:#3b1b1b;
  --plot-bg:#1a1f27; --plot-grid:#2c343f; --plot-fg:#e6e9ee;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.muted{color:var(--fg3)}
.small{font-size:12px}
a{color:var(--accent)}

/* App frame */
#app{display:grid;grid-template-rows:48px 1fr;height:100%}
#topbar{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
#topbar .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.01em}
#topbar .brand .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
#topbar .company{display:flex;align-items:center;gap:8px;border:none;background:none;padding:2px 8px 2px 2px;border-right:1px solid var(--line);border-radius:0;cursor:pointer;color:var(--fg);font:inherit;font-weight:600;max-width:280px}
#topbar .company img{height:30px;width:auto;max-width:60px;object-fit:contain}
#topbar .company .cname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#topbar .company .cadd{font-size:12px;color:var(--fg3);font-weight:500}
#topbar .company.empty{border-right:1px dashed var(--line)}
#topbar .company:hover .cadd,#topbar .company:hover .cname{color:var(--accent)}
.logo-prev{width:120px;height:120px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;margin-bottom:6px}
.logo-prev img{max-width:100px;max-height:100px}
.logo-prev.light{background:#fff}.logo-prev.dark{background:#15191f}
.welcome{max-width:1080px;margin:10px auto 30px;padding:0 4px}
.welcome .wl-hero{display:flex;align-items:center;gap:18px;margin:8px 0 10px}
.welcome .wl-logo{height:64px;width:auto}
.welcome h1{font-size:30px;margin:0;letter-spacing:-.01em}
.welcome .lead{font-size:16px;color:var(--fg2);margin:4px 0 0}
.welcome .wl-intro{font-size:14px;line-height:1.55;color:var(--fg2);max-width:820px}
.wl-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.wl-card{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:8px}
.wl-card h3{margin:0;font-size:15px}.wl-card p{margin:0;font-size:13px;color:var(--fg2);line-height:1.5;flex:1}
.wl-card .wl-n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.wl-card .dropzone{padding:16px;text-align:center}
.wl-foot{margin-top:16px}
.guide{display:grid;grid-template-columns:210px 1fr;gap:18px;min-height:460px}
.guide nav{display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line2);padding-right:10px}
.guide nav button{display:flex;align-items:center;gap:8px;text-align:left;border:none;background:none;padding:7px 8px;border-radius:6px;font:inherit;font-size:13px;color:var(--fg2);cursor:pointer}
.guide nav button:hover{background:var(--surface2)}
.guide nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.guide nav .gn{width:20px;height:20px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px;flex:none}
.guide .gc{min-width:0;font-size:13.5px;line-height:1.55}
.guide .gc h2{margin:0 0 8px;font-size:18px}
.guide .gc ul{padding-left:18px;margin:6px 0}
.guide .gimg{display:block;width:100%;border:1px solid var(--line);border-radius:8px;margin-top:10px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
@media (max-width:760px){.guide{grid-template-columns:1fr}.guide nav{flex-direction:row;flex-wrap:wrap;border-right:none}#topbar .company .cname{display:none}}
#topbar .spacer{flex:1}
#topbar .status{font-size:12px;color:var(--fg3)}
#body{display:grid;grid-template-columns:var(--sidebar-w) 6px 1fr;min-height:0;height:100%}
#sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#dragbar{cursor:col-resize;background:transparent}
#dragbar:hover,#dragbar.active{background:var(--accent-soft)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{display:flex;gap:2px;padding:8px 14px 0;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:1px solid transparent;border-bottom:none;background:transparent;padding:7px 12px;border-radius:6px 6px 0 0;color:var(--fg2);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.active{background:var(--bg);border-color:var(--line);color:var(--fg);position:relative;top:1px}
#view{flex:1;min-height:0;overflow:auto;padding:14px 16px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Buttons and inputs */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);font-size:13px;font-weight:500;color:var(--fg)}
.btn:hover{border-color:var(--fg3)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2)}
.btn.ghost:hover{background:var(--surface2);color:var(--fg)}
.btn.danger{color:var(--bad)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.input,select.input,textarea.input{padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);min-width:0}
.input.small{padding:3px 6px;font-size:12px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:none;background:var(--surface);padding:5px 10px;font-size:12px;color:var(--fg2)}
.seg button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;background:var(--surface2);color:var(--fg2);border:1px solid var(--line2)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.axis{font-family:var(--mono)}

/* Sidebar tree */
#sidebar .sb-head{padding:10px 12px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
#sidebar .sb-head h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:600;flex:1}
#tree{flex:1;overflow:auto;padding:6px 6px 12px}
.sess{margin-bottom:6px}
.sess-h{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--radius);cursor:pointer;font-weight:600}
.sess-h:hover{background:var(--surface2)}
.sess-h.active{background:var(--accent-soft);color:var(--accent)}
.sess-h .caret{width:14px;display:inline-block;color:var(--fg3);font-size:11px}
.sess-h .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.axis-group{margin:2px 0 2px 14px}
.axis-group .ag-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);padding:5px 8px 2px;font-weight:600}
.tnode{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 10px;border-radius:var(--radius);cursor:pointer;font-size:13px}
.tnode:hover{background:var(--surface2)}
.tnode.active{background:var(--accent-soft);color:var(--accent)}
.tnode.dropover{outline:2px dashed var(--accent);outline-offset:-2px}
.tnode .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.tnode .dot.has{background:var(--good)}
.tnode .dot.partial{background:var(--warn)}
.tnode .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .run{font-family:var(--mono);font-size:11px;color:var(--fg3)}
#sidebar .sb-foot{border-top:1px solid var(--line2);padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap}

/* Cards and panels */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card .card-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2)}
.card .card-h h3{font-size:13.5px;font-weight:600;flex:1;white-space:nowrap}
.card-h .hint{flex:3 1 200px;min-width:0}
.card .card-b{padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:500;margin-top:2px}
.kpi .s{font-size:12px;color:var(--fg2)}

/* Plot container: user-resizable vertically */
.plotbox{position:relative;resize:vertical;overflow:hidden;min-height:220px;height:380px;border-top:1px solid var(--line2)}
.plotbox .plot{position:absolute;inset:0}
.plotbox.tall{height:460px}
.plot-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* Tables */
.tbl-wrap{overflow:auto;max-width:100%}
.filerow{flex-wrap:nowrap}
.filerow .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
table.tbl th,table.tbl td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap;position:relative}
table.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);font-weight:600;background:var(--surface2);position:sticky;top:0;z-index:1;user-select:none}
table.tbl th .rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize}
table.tbl th .rz:hover{background:var(--accent-soft)}
table.tbl td.num,table.tbl th.num{text-align:right}
table.tbl tr:hover td{background:var(--surface2)}
table.tbl tr.sel td{background:var(--accent-soft)}
table.tbl .sw{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
table.tbl input.input,table.tbl select.input{width:100%}

/* Matrix */
.matrix{display:grid;gap:8px}
.matrix .mh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:600;padding:4px 6px;align-self:end}
.mcell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;min-height:66px;display:flex;flex-direction:column;gap:3px}
.mcell:hover{border-color:var(--accent)}
.mcell.empty{background:transparent;border-style:dashed;color:var(--fg3);justify-content:center;align-items:center}
.mcell .t{font-size:12px;color:var(--fg2);display:flex;justify-content:space-between;gap:6px}
.mcell .v{font-family:var(--mono);font-size:15px;font-weight:500}
.mcell .s{font-size:11.5px;color:var(--fg3)}

/* Dropzone */
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--fg2);background:var(--surface)}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone strong{color:var(--fg)}
#globaldrop{position:fixed;inset:0;background:rgba(31,86,214,.12);border:4px dashed var(--accent);z-index:50;display:none;place-items:center;font-size:20px;font-weight:600;color:var(--accent);pointer-events:none}
#globaldrop.show{display:grid}

/* Context menu, toasts, modal */
#ctx{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:180px;padding:4px;display:none}
#ctx button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:7px 10px;border-radius:5px;font-size:13px}
#ctx button:hover{background:var(--surface2)}
#ctx button.danger{color:var(--bad)}
#ctx hr{border:none;border-top:1px solid var(--line2);margin:4px 0}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--fg);color:var(--bg);padding:9px 12px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:380px}
.toast.bad{background:var(--bad);color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:65;display:none;place-items:center;padding:16px}
#modal.show{display:grid}
#modal .box.wide{width:min(1180px,100%)}
.colsrow td{background:var(--surface2)}
.colsed td,.colsed th{padding:3px 6px}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto}
#modal .box .mh{padding:12px 16px;border-bottom:1px solid var(--line2);font-weight:600;display:flex;align-items:center}
#modal .box .mh span{flex:1}
#modal .box .mb{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#modal .box .mf{padding:10px 16px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}
.field{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:8px}
.field label{font-size:12.5px;color:var(--fg2)}

/* Channel chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12px;cursor:pointer;user-select:none}
.chip .sw{width:12px;height:3px;border-radius:2px}
.chip.off{opacity:.45}
.chip:hover{border-color:var(--fg3)}
.sensor-block{display:flex;flex-direction:column;gap:4px}
.sensor-block .sb-name{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);font-weight:600}
.chip.drive{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip .small{font-size:10px}

/* Sensor columns in the test view: sensors left to right, X/Y/Z chips stacked under each */
.scols{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start}
.scol{display:flex;flex-direction:column;gap:3px;min-width:168px;flex:0 0 auto;padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--surface2)}
.scol .sch{display:flex;align-items:center;gap:6px;min-width:0;padding-bottom:3px;border-bottom:1px solid var(--line2);margin-bottom:2px}
.scol .sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.scol .sname{font-size:12.5px;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.scol .sname:hover{color:var(--accent)}
.scol .pill{font-size:9.5px;padding:0 5px;flex:none}
.scol .chips{flex-direction:column;align-items:stretch;gap:3px}
.scol .chip{padding:2px 7px;font-size:11.5px;justify-content:flex-start;background:var(--surface)}
.scol .chip .ax{font-weight:600;width:30px;flex:none}
.scol .chip .ax .muted{font-weight:400;font-size:10px;margin-left:2px}
.scol .chip .pk{font-size:11px;white-space:nowrap}

/* Per-sensor plot grid */
#p-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#p-grid[data-h="s"]{grid-template-columns:repeat(3,minmax(0,1fr))}
#p-grid[data-h="l"]{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){#p-grid[data-h="s"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){#p-grid,#p-grid[data-h="s"]{grid-template-columns:minmax(0,1fr)}}
.sgcell{border:1px solid var(--line2);border-radius:8px;background:var(--surface);min-width:0}
.sgcell.flag{border-color:var(--bad)}
.sgcell .sgt{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px;min-width:0}
.sgcell .sgt .sw{width:10px;height:10px;border-radius:50%;flex:none}
.sgcell .sgt strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgcell .sgt .pill{margin-left:auto;font-size:10px;flex:none}
.sgcell .sgk{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 10px 6px;border-bottom:1px solid var(--line2);font-size:11.5px}
.sgcell .sgk .pkx{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sgcell .sgk .sw{display:inline-block;width:14px;height:3px;border-radius:2px}
.sgcell .sgp{position:relative;height:240px}
#p-grid[data-h="s"] .sgcell .sgp{height:200px}
#p-grid[data-h="l"] .sgcell .sgp{height:380px}
.tnode.is-hidden,.sess.is-hidden>.sess-h{opacity:.55}
.tnode.is-hidden .lbl{text-decoration:line-through dotted}
.tnode.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.tnode.dropbefore{box-shadow:inset 0 2px 0 var(--accent)}
.tnode.dropafter{box-shadow:inset 0 -2px 0 var(--accent)}
.tnode.dragging{opacity:.4}
.ag-h.dropover{color:var(--accent)}
#sidebar .sb-head .chk{font-size:11.5px;color:var(--fg3);white-space:nowrap;gap:4px}
