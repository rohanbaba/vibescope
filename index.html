<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VibeScope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed top bar, resizable left tree of sessions and tests, main workspace with tabs. Engineering-console look: cool graphite neutrals, cobalt accent, mono for numbers. */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f6f7fa; --line:#d6dae3; --line2:#e6e9ef;
  --fg:#17202b; --fg2:#4b5563; --fg3:#7b8594;
  --accent:#1f56d6; --accent-fg:#ffffff; --accent-soft:#e3ebfb;
  --good:#1a8a4a; --warn:#b26a00; --bad:#c62828; --good-soft:#e2f3e8; --warn-soft:#fbefd6; --bad-soft:#fbe3e3;
  --plot-bg:#ffffff; --plot-grid:#e4e7ee; --plot-fg:#17202b;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:6px; --shadow:0 1px 2px rgba(20,30,50,.08),0 4px 14px rgba(20,30,50,.06);
  --sidebar-w:300px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a1f27; --surface2:#20262f; --line:#2f3741; --line2:#272e38;
  --fg:#e6e9ee; --fg2:#aab2bf; --fg3:#7d8794;
  --accent:#6f95ff; --accent-fg:#0d1526; --accent-soft:#1f2b48;
  --good:#4cc47c; --warn:#e3a53a; --bad:#ef6a6a; --good-soft:#15301f; --warn-soft:#3a2d12; --bad-soft:#3b1b1b;
  --plot-bg:#1a1f27; --plot-grid:#2c343f; --plot-fg:#e6e9ee;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a1f27; --surface2:#20262f; --line:#2f3741; --line2:#272e38;
  --fg:#e6e9ee; --fg2:#aab2bf; --fg3:#7d8794;
  --accent:#6f95ff; --accent-fg:#0d1526; --accent-soft:#1f2b48;
  --good:#4cc47c; --warn:#e3a53a; --bad:#ef6a6a; --good-soft:#15301f; --warn-soft:#3a2d12; --bad-soft:#3b1b1b;
  --plot-bg:#1a1f27; --plot-grid:#2c343f; --plot-fg:#e6e9ee;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.muted{color:var(--fg3)}
.small{font-size:12px}
a{color:var(--accent)}

/* App frame */
#app{display:grid;grid-template-rows:48px 1fr;height:100%}
#topbar{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
#topbar .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.01em}
#topbar .brand .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
#topbar .company{display:flex;align-items:center;gap:8px;border:none;background:none;padding:2px 8px 2px 2px;border-right:1px solid var(--line);border-radius:0;cursor:pointer;color:var(--fg);font:inherit;font-weight:600;max-width:280px}
#topbar .company img{height:30px;width:auto;max-width:60px;object-fit:contain}
#topbar .company .cname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#topbar .company .cadd{font-size:12px;color:var(--fg3);font-weight:500}
#topbar .company.empty{border-right:1px dashed var(--line)}
#topbar .company:hover .cadd,#topbar .company:hover .cname{color:var(--accent)}
.logo-prev{width:120px;height:120px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;margin-bottom:6px}
.logo-prev img{max-width:100px;max-height:100px}
.logo-prev.light{background:#fff}.logo-prev.dark{background:#15191f}
.welcome{max-width:1080px;margin:10px auto 30px;padding:0 4px}
.welcome .wl-hero{display:flex;align-items:center;gap:18px;margin:8px 0 10px}
.welcome .wl-logo{height:64px;width:auto}
.welcome h1{font-size:30px;margin:0;letter-spacing:-.01em}
.welcome .lead{font-size:16px;color:var(--fg2);margin:4px 0 0}
.welcome .wl-intro{font-size:14px;line-height:1.55;color:var(--fg2);max-width:820px}
.wl-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.wl-card{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:8px}
.wl-card h3{margin:0;font-size:15px}.wl-card p{margin:0;font-size:13px;color:var(--fg2);line-height:1.5;flex:1}
.wl-card .wl-n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.wl-card .dropzone{padding:16px;text-align:center}
.wl-foot{margin-top:16px}
.guide{display:grid;grid-template-columns:210px 1fr;gap:18px;min-height:460px}
.guide nav{display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line2);padding-right:10px}
.guide nav button{display:flex;align-items:center;gap:8px;text-align:left;border:none;background:none;padding:7px 8px;border-radius:6px;font:inherit;font-size:13px;color:var(--fg2);cursor:pointer}
.guide nav button:hover{background:var(--surface2)}
.guide nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.guide nav .gn{width:20px;height:20px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px;flex:none}
.guide .gc{min-width:0;font-size:13.5px;line-height:1.55}
.guide .gc h2{margin:0 0 8px;font-size:18px}
.guide .gc ul{padding-left:18px;margin:6px 0}
.guide .gimg{display:block;width:100%;border:1px solid var(--line);border-radius:8px;margin-top:10px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
@media (max-width:760px){.guide{grid-template-columns:1fr}.guide nav{flex-direction:row;flex-wrap:wrap;border-right:none}#topbar .company .cname{display:none}}
#topbar .spacer{flex:1}
#topbar .status{font-size:12px;color:var(--fg3)}
#body{display:grid;grid-template-columns:var(--sidebar-w) 6px 1fr;min-height:0;height:100%}
#sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#dragbar{cursor:col-resize;background:transparent}
#dragbar:hover,#dragbar.active{background:var(--accent-soft)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{display:flex;gap:2px;padding:8px 14px 0;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:1px solid transparent;border-bottom:none;background:transparent;padding:7px 12px;border-radius:6px 6px 0 0;color:var(--fg2);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.active{background:var(--bg);border-color:var(--line);color:var(--fg);position:relative;top:1px}
#view{flex:1;min-height:0;overflow:auto;padding:14px 16px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Buttons and inputs */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);font-size:13px;font-weight:500;color:var(--fg)}
.btn:hover{border-color:var(--fg3)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2)}
.btn.ghost:hover{background:var(--surface2);color:var(--fg)}
.btn.danger{color:var(--bad)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.input,select.input,textarea.input{padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);min-width:0}
.input.small{padding:3px 6px;font-size:12px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:none;background:var(--surface);padding:5px 10px;font-size:12px;color:var(--fg2)}
.seg button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;background:var(--surface2);color:var(--fg2);border:1px solid var(--line2)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.axis{font-family:var(--mono)}

/* Sidebar tree */
#sidebar .sb-head{padding:10px 12px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
#sidebar .sb-head h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:600;flex:1}
#tree{flex:1;overflow:auto;padding:6px 6px 12px}
.sess{margin-bottom:6px}
.sess-h{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--radius);cursor:pointer;font-weight:600}
.sess-h:hover{background:var(--surface2)}
.sess-h.active{background:var(--accent-soft);color:var(--accent)}
.sess-h .caret{width:14px;display:inline-block;color:var(--fg3);font-size:11px}
.sess-h .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.axis-group{margin:2px 0 2px 14px}
.axis-group .ag-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);padding:5px 8px 2px;font-weight:600}
.tnode{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 10px;border-radius:var(--radius);cursor:pointer;font-size:13px}
.tnode:hover{background:var(--surface2)}
.tnode.active{background:var(--accent-soft);color:var(--accent)}
.tnode.dropover{outline:2px dashed var(--accent);outline-offset:-2px}
.tnode .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.tnode .dot.has{background:var(--good)}
.tnode .dot.partial{background:var(--warn)}
.tnode .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .run{font-family:var(--mono);font-size:11px;color:var(--fg3)}
#sidebar .sb-foot{border-top:1px solid var(--line2);padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap}

/* Cards and panels */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card .card-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2)}
.card .card-h h3{font-size:13.5px;font-weight:600;flex:1;white-space:nowrap}
.card-h .hint{flex:3 1 200px;min-width:0}
.card .card-b{padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:500;margin-top:2px}
.kpi .s{font-size:12px;color:var(--fg2)}

/* Plot container: user-resizable vertically */
.plotbox{position:relative;resize:vertical;overflow:hidden;min-height:220px;height:380px;border-top:1px solid var(--line2)}
.plotbox .plot{position:absolute;inset:0}
.plotbox.tall{height:460px}
.plot-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* Tables */
.tbl-wrap{overflow:auto;max-width:100%}
.filerow{flex-wrap:nowrap}
.filerow .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
table.tbl th,table.tbl td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap;position:relative}
table.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);font-weight:600;background:var(--surface2);position:sticky;top:0;z-index:1;user-select:none}
table.tbl th .rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize}
table.tbl th .rz:hover{background:var(--accent-soft)}
table.tbl td.num,table.tbl th.num{text-align:right}
table.tbl tr:hover td{background:var(--surface2)}
table.tbl tr.sel td{background:var(--accent-soft)}
table.tbl .sw{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
table.tbl input.input,table.tbl select.input{width:100%}

/* Matrix */
.matrix{display:grid;gap:8px}
.matrix .mh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:600;padding:4px 6px;align-self:end}
.mcell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;min-height:66px;display:flex;flex-direction:column;gap:3px}
.mcell:hover{border-color:var(--accent)}
.mcell.empty{background:transparent;border-style:dashed;color:var(--fg3);justify-content:center;align-items:center}
.mcell .t{font-size:12px;color:var(--fg2);display:flex;justify-content:space-between;gap:6px}
.mcell .v{font-family:var(--mono);font-size:15px;font-weight:500}
.mcell .s{font-size:11.5px;color:var(--fg3)}

/* Dropzone */
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--fg2);background:var(--surface)}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone strong{color:var(--fg)}
#globaldrop{position:fixed;inset:0;background:rgba(31,86,214,.12);border:4px dashed var(--accent);z-index:50;display:none;place-items:center;font-size:20px;font-weight:600;color:var(--accent);pointer-events:none}
#globaldrop.show{display:grid}

/* Context menu, toasts, modal */
#ctx{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:180px;padding:4px;display:none}
#ctx button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:7px 10px;border-radius:5px;font-size:13px}
#ctx button:hover{background:var(--surface2)}
#ctx button.danger{color:var(--bad)}
#ctx hr{border:none;border-top:1px solid var(--line2);margin:4px 0}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--fg);color:var(--bg);padding:9px 12px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:380px}
.toast.bad{background:var(--bad);color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:65;display:none;place-items:center;padding:16px}
#modal.show{display:grid}
#modal .box.wide{width:min(1180px,100%)}
.colsrow td{background:var(--surface2)}
.colsed td,.colsed th{padding:3px 6px}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto}
#modal .box .mh{padding:12px 16px;border-bottom:1px solid var(--line2);font-weight:600;display:flex;align-items:center}
#modal .box .mh span{flex:1}
#modal .box .mb{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#modal .box .mf{padding:10px 16px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}
.field{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:8px}
.field label{font-size:12.5px;color:var(--fg2)}

/* Channel chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12px;cursor:pointer;user-select:none}
.chip .sw{width:12px;height:3px;border-radius:2px}
.chip.off{opacity:.45}
.chip:hover{border-color:var(--fg3)}
.sensor-block{display:flex;flex-direction:column;gap:4px}
.sensor-block .sb-name{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);font-weight:600}
.chip.drive{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip .small{font-size:10px}

/* Sensor columns in the test view: sensors left to right, X/Y/Z chips stacked under each */
.scols{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start}
.scol{display:flex;flex-direction:column;gap:3px;min-width:168px;flex:0 0 auto;padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--surface2)}
.scol .sch{display:flex;align-items:center;gap:6px;min-width:0;padding-bottom:3px;border-bottom:1px solid var(--line2);margin-bottom:2px}
.scol .sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.scol .sname{font-size:12.5px;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.scol .sname:hover{color:var(--accent)}
.scol .pill{font-size:9.5px;padding:0 5px;flex:none}
.scol .chips{flex-direction:column;align-items:stretch;gap:3px}
.scol .chip{padding:2px 7px;font-size:11.5px;justify-content:flex-start;background:var(--surface)}
.scol .chip .ax{font-weight:600;width:30px;flex:none}
.scol .chip .ax .muted{font-weight:400;font-size:10px;margin-left:2px}
.scol .chip .pk{font-size:11px;white-space:nowrap}

/* Per-sensor plot grid */
#p-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#p-grid[data-h="s"]{grid-template-columns:repeat(3,minmax(0,1fr))}
#p-grid[data-h="l"]{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){#p-grid[data-h="s"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){#p-grid,#p-grid[data-h="s"]{grid-template-columns:minmax(0,1fr)}}
.sgcell{border:1px solid var(--line2);border-radius:8px;background:var(--surface);min-width:0}
.sgcell.flag{border-color:var(--bad)}
.sgcell .sgt{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px;min-width:0}
.sgcell .sgt .sw{width:10px;height:10px;border-radius:50%;flex:none}
.sgcell .sgt strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgcell .sgt .pill{margin-left:auto;font-size:10px;flex:none}
.sgcell .sgk{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 10px 6px;border-bottom:1px solid var(--line2);font-size:11.5px}
.sgcell .sgk .pkx{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sgcell .sgk .sw{display:inline-block;width:14px;height:3px;border-radius:2px}
.sgcell .sgp{position:relative;height:240px}
#p-grid[data-h="s"] .sgcell .sgp{height:200px}
#p-grid[data-h="l"] .sgcell .sgp{height:380px}
.tnode.is-hidden,.sess.is-hidden>.sess-h{opacity:.55}
.tnode.is-hidden .lbl{text-decoration:line-through dotted}
.tnode.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.tnode.dropbefore{box-shadow:inset 0 2px 0 var(--accent)}
.tnode.dropafter{box-shadow:inset 0 -2px 0 var(--accent)}
.tnode.dragging{opacity:.4}
.ag-h.dropover{color:var(--accent)}
#sidebar .sb-head .chk{font-size:11.5px;color:var(--fg3);white-space:nowrap;gap:4px}
.hoverlist{position:absolute;z-index:6;display:none;width:300px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:11.5px;padding:6px 8px}
.hoverlist .hl-h{font-weight:600;color:var(--fg2);margin-bottom:2px;font-family:"IBM Plex Mono",monospace;font-size:11px;display:flex;align-items:center;gap:6px;position:sticky;top:-6px;background:var(--surface);padding-top:2px}
.hoverlist .hl-h span{flex:1}
.hoverlist .hl-x{border:none;background:none;cursor:pointer;color:var(--fg3);font-size:12px}
.hoverlist .hl-tip{font-size:10.5px;color:var(--fg3);margin-bottom:4px}
.hoverlist.pinned{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 6px 24px rgba(0,0,0,.18)}
.hoverlist .hl-b.cols{column-count:2;column-gap:12px}
.hoverlist .hl-b.cols{width:100%}
.hoverlist:has(.hl-b.cols){width:520px}
.hoverlist .hl-r{display:flex;align-items:center;gap:5px;padding:1px 0;break-inside:avoid}
.hoverlist .hl-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hoverlist .hl-v{font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.hoverlist .sw{width:9px;height:9px;border-radius:2px;flex:none}
.sigbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;margin:-4px 0 14px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);background:var(--surface)}
.sb-mode{padding:8px 12px 2px}
.sb-group{margin-top:6px;color:var(--fg3);font-size:11.5px}
.axis-group .ag-sub{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);padding:4px 8px 1px 18px;opacity:.85}
.sb-mode .seg{display:flex}
.sb-mode .seg button{flex:1}
.tnode .date{color:var(--fg3);font-size:11px;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.camp-note{margin:2px 0 4px 22px;font-size:11.5px;color:var(--fg3)}
.runchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12px;cursor:pointer;white-space:nowrap}
.runchip:hover{border-color:var(--accent)}
.runchip.has{border-color:var(--good);background:var(--good-soft)}
.runchip.partial{border-color:var(--warn)}
.runchip.hid{border-style:dashed;opacity:.6}
.runchip .mono{color:var(--fg3);font-size:11px}
tr.hid td{opacity:.6}
#p-grid[data-h="l"] .sgcell .sgp{height:340px}
#p-grid[data-h="l"]{grid-template-columns:repeat(auto-fill,minmax(560px,1fr))}
.sgcell .sgp .plot{position:absolute;inset:0}

/* Sensor table inputs */
input.colr{width:32px;height:24px;border:1px solid var(--line);border-radius:4px;background:transparent;padding:0}
table.tbl input.input.num{text-align:right;font-family:var(--mono)}
#s3-sensors td{padding:3px 4px}
details.card summary{list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary h3{font-size:13.5px;font-weight:600}
details.card[open] summary{border-bottom:1px solid var(--line2)}

/* 3D */
#three-wrap{position:relative;height:520px;resize:vertical;overflow:hidden;border-radius:0 0 8px 8px;min-height:300px}
#three-wrap canvas{display:block;width:100%;height:100%}
#three-legend{position:absolute;left:10px;top:10px;max-width:min(46%,320px);max-height:calc(100% - 20px);overflow:auto;background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;line-height:1.35;display:flex;flex-direction:column;gap:2px}
#three-legend div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#three-legend .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
#three-leg-btn{position:absolute;right:10px;top:10px}
.hint{font-size:12px;color:var(--fg3)}

/* Sections */
.section-h{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px}
.section-h h2{font-size:17px;font-weight:600}
.section-h .sub{color:var(--fg3);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--fg3)}
.hidden{display:none !important}
.notes{width:100%;min-height:54px;resize:vertical}
kbd{font-family:var(--mono);font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 5px}

@media (min-width:761px){
  #body.sb-collapsed{grid-template-columns:1fr}
  #body.sb-collapsed #sidebar,#body.sb-collapsed #dragbar{display:none}
}
@media (max-width:760px){
  #topbar{gap:6px;padding:0 8px}
  #topbar .status,#topbar .brand span:last-child{display:none}
  #topbar .btn{padding:4px 7px;font-size:12px}
  .matrix-wrap{overflow-x:auto}
  .matrix{min-width:560px}
  #body{grid-template-columns:1fr}
  #sidebar{position:fixed;left:0;top:48px;bottom:0;width:min(86vw,320px);z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  #sidebar.open{transform:none}
  #dragbar{display:none}
  .field{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<div id="app">
  <div id="topbar">
    <button class="btn ghost small" id="btn-menu" title="Show or hide the left panel" aria-label="Show or hide the left panel">☰</button>
    <button class="company" id="company" title="Company name and logo"></button>
    <div class="brand"><span class="mark">VS</span><span>VibeScope</span><span class="small muted mono" id="ver"></span></div>
    <span class="status" id="status">Ready</span>
    <div class="spacer"></div>
    <button class="btn small" id="btn-import" title="Import data exports (csv, txt, xlsx) and test reports (pdf, doc, docx)">Import files</button>
    <input type="file" id="file-input" multiple accept=".xlsx,.xls,.csv,.txt,.tsv,.doc,.docx,.pdf" hidden>
    <button class="btn small" id="btn-save" title="Save the whole project (tests, data, sensor maps) as a JSON file">Save project</button>
    <button class="btn small" id="btn-load" title="Load a saved project JSON">Load project</button>
    <input type="file" id="proj-input" accept=".json,.gz,application/json,application/gzip" hidden>
    <button class="btn ghost small" id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
    <button class="btn ghost small" id="btn-redo" title="Redo (Ctrl+Y or Ctrl+Shift+Z)">↷</button>
    <button class="btn ghost small" id="btn-theme" title="Toggle dark mode">Theme</button>
    <button class="btn ghost small" id="btn-help" title="Guide and reference">Guide</button>
  </div>
  <div id="body">
    <aside id="sidebar">
      <div class="sb-head"><h2 id="sb-title">Sessions</h2><label class="chk small" title="Show the hidden tests and sessions (check runs, wrong levels, faulty sets)"><input type="checkbox" id="sb-showhidden"> hidden <span id="sb-hidden-count"></span></label><button class="btn ghost small" id="btn-new-session" title="New session">+ Session</button></div>
      <div class="sb-mode"><div class="seg" id="sb-mode" title="Show the tests by test day (sessions) or grouped into test campaigns (only the runs that count)"><button data-tm="date">By date</button><button data-tm="campaign">Campaigns</button></div><label class="chk small sb-group" title="Show Sine, Random and SRS sub-headings under each axis (tests stay in run order inside each)"><input type="checkbox" id="sb-group"> Group by test type</label></div>
      <div id="tree"></div>
      <div class="sb-foot">
        <button class="btn small" id="btn-new-test">+ Test</button>
        <button class="btn small" id="btn-autobuild" title="Create the standard test matrix for the active session">Standard matrix</button>
      </div>
    </aside>
    <div id="dragbar"></div>
    <section id="main">
      <nav id="tabs">
        <button class="tab active" data-tab="overview">Overview</button>
        <button class="tab" data-tab="test">Test</button>
        <button class="tab" data-tab="compare">Compare</button>
        <button class="tab" data-tab="signatures">Signatures</button>
        <button class="tab" data-tab="sensors">Sensors and 3D</button>
        <button class="tab" data-tab="files">Files</button>
        <button class="tab" data-tab="settings">Profiles and settings</button>
      </nav>
      <div id="view"></div>
    </section>
  </div>
</div>

function migrateSession(s) {

  s.sensors.forEach((x, i) => {

    if (!x.p3) { const pl = PL[x.place] || PL.ring; x.p3 = { r: pl.r, angle: x.angle || 0, z: pl.z }; }
    if (x.pos == null) x.pos = x.id === 'CTRL' ? 0 : i + (s.sensors[0]?.id === 'CTRL' ? 0 : 1);
    if (!x.part) x.part = x.id === 'CTRL' ? 'table' : (x.place === 'table' ? 'table' : 'fixture');
    if (!x.sens) x.sens = {}; if (!x.orient) x.orient = {}; if (x.brand == null) x.brand = ''; if (x.serial == null) x.serial = '';
    if (!x.color) x.color = SENSOR_COLORS[i % SENSOR_COLORS.length];

/* ---------- Undo / redo ----------

  const sessions = P.sessions.map(s => { const c = { ...s }; delete c.collapsed; return c; });
  const key = JSON.stringify([sessions, P.tests, P.profiles, P.name, P.files.map(f => [f.id, f.testId, f.sessionId])]);
  return { key, fileRefs: P.files.slice() };
}

function historyNote() {
  if (!P) return;
  const snap = structSnapshot();
  if (HIST.current && HIST.current.key === snap.key) { HIST.current.fileRefs = snap.fileRefs; return; }
  if (HIST.current) { HIST.undo.push(HIST.current); if (HIST.undo.length > HIST.max) HIST.undo.shift(); HIST.redo = []; }
  HIST.current = snap; updateHistoryButtons();
}

  const [sessions, tests, profiles, name, fileMeta] = JSON.parse(snap.key);
  const collapsed = Object.fromEntries(P.sessions.map(s => [s.id, s.collapsed]));
  P.sessions = sessions.map(s => { s.collapsed = collapsed[s.id] ?? false; return migrateSession(s); }); P.tests = tests; P.profiles = profiles; P.name = name;
  const meta = new Map(fileMeta.map(m => [m[0], m])); P.files = snap.fileRefs.slice();
  for (const f of P.files) { const m = meta.get(f.id); if (m) { f.testId = m[1]; f.sessionId = m[2]; } }
  if (!P.sessions.some(s => s.id === UI.sessionId)) UI.sessionId = P.sessions[0]?.id || null;
  if (UI.testId && !P.tests.some(t => t.id === UI.testId)) { UI.testId = null; if (UI.tab === 'test') UI.tab = 'overview'; }
  UI.compare.tests = UI.compare.tests.filter(id => P.tests.some(t => t.id === id)); UI.sel.clear();
  LF_CACHE.clear(); M_CACHE.clear(); if (typeof SIG_CACHE !== 'undefined') SIG_CACHE.clear();

}
function undo() { if (!HIST.undo.length) { toast('Nothing to undo'); return; } const snap = HIST.undo.pop(); HIST.redo.push(HIST.current); historyRestore(snap); toast('Undone'); }

/* Any table with a header and numeric columns: the first column is frequency (Hz) or time (s or ms), the others are channels.

    else if (d.level != null && d.level <= 0.5) { d.kindId = 'lowsine'; d.confidence = 0.95; }
    else if (d.level != null && d.level > 0.5) { d.kindId = 'sineq'; d.confidence = 0.9; }
    else if (d.f1 != null && d.f2 <= 200) { d.kindId = 'sineq'; d.confidence = 0.6; }

async function importFiles(fileList, forceTestId = null, opts = {}) {
  const files = Array.from(fileList); if (!files.length) return;
  let bad = 0; const log = [];
  setStatus('Importing…');

  for (const file of files) { try { parsed.push(await parseFile(file)); } catch (e) { bad++; log.push(`${file.name}: ${e.message}`); console.error(e); } }
  // data files first, reports last, so a report finds the test its run created
  parsed.sort((a, b) => (a.kind === 'report') - (b.kind === 'report'));
  // files that the name rules cannot place (any other lab's or DAQ's export) go through the review dialog first
  if (!parsed.length) { toast(`Could not read ${bad} file(s): ${log[0] || ''}`, true); setStatus('Ready'); return; }
  let plan = null; let sess = activeSession();
  if (!forceTestId && (opts.review || needsReview(parsed))) { plan = await reviewImportDialog(parsed, sess); if (!plan) { setStatus('Import cancelled'); return; } }
  if (!plan && !sess) { const s = newSession('Session ' + new Date().toISOString().slice(0, 10), new Date().toISOString().slice(0, 10)); P.sessions.push(s); UI.sessionId = s.id; buildStandardMatrix(s.id); sess = s; }
  if (plan) { UI.sessionId = plan.sessionId; if (UI.tab === 'overview' || !UI.tab) UI.tab = 'overview'; }

  const dups = parsed.filter(pf => P.files.some(f => norm(f.name) === norm(pf.name) && f.sessionId === sess.id));
  let dupMode = 'replace';
  if (dups.length) dupMode = await askDuplicates(dups);
  for (const pf of parsed) {
    const old = P.files.find(f => norm(f.name) === norm(pf.name) && f.sessionId === sess.id);
    let targetTest = forceTestId;
    if (old) {
      if (dupMode === 'skip') { skipped++; continue; }
      if (dupMode === 'replace') { targetTest = targetTest || old.testId; if (old.testId) { const t = P.tests.find(t => t.id === old.testId); if (t) t.fileIds = t.fileIds.filter(x => x !== old.id); } P.files = P.files.filter(f => f.id !== old.id); replaced++; }
      else { pf.name = pf.name.replace(/(\.[^.]+)$/, ' (2)$1'); }
    }

    if (!targetTest && tgt === 'new') { const d = pf.detected; const nt = newTest(sess.id, d.axis || 'X', d.kindId || 'custom', d.run, null); P.tests.push(nt); targetTest = nt.id; }
    else if (!targetTest && tgt && tgt !== 'auto') targetTest = tgt;
    if (targetTest) assignFileToTest(pf.id, targetTest);
    else { const r = autoAssign(pf, sess); if (!r) unassigned++; }
  }
  persist(); render();
  toast(`${ok} file(s) imported${replaced ? `, ${replaced} replaced` : ''}${skipped ? `, ${skipped} skipped` : ''}${unassigned ? `, ${unassigned} need manual assignment (see Files)` : ''}${bad ? `, ${bad} failed` : ''}`, bad > 0);

}

/* What distinguishes a run in a sequence strip: kind, level and profile in a few characters. */
function seqLabel(t) {

  if (k.type === 'random' && t.kind !== 'lowrand') { const db = testLevelDb(t); return `Rand ${lp ? (lp.short || 'custom') : ''}${db ? ' ' + db + ' dB' : lp ? '' : ' 0 dB'}`.replace(/\s+/g, ' ').trim(); }

function highestLevel(list) {
  const rands = list.filter(t => specFileOf(t)?.kind === 'psd').map(t => ({ t, m: computeMetrics(t) })).filter(x => x.m.control?.grms).sort((a, b) => b.m.control.grms - a.m.control.grms);

/* Signature shift of a sine sweep against the previous sine sweep of the same axis in the session (by run number). */
function sigShiftOf(t, ts) {
  const prev = ts.filter(q => q.id !== t.id && q.axis === t.axis && specFileOf(q)?.kind === 'sine' && (q.run ?? -1) < (t.run ?? 1e9) && controlCol(specFileOf(q))).sort(byRun).pop();

function runTable(ts, sigs, withDate = false) {

function topResponses(ts, n = 8) {

/* Axes in the order they were (or will be) tested: by the first run number in each axis, then by when the slots were created. */
function axisOrder(ts) {
  const ax = [...new Set(ts.map(t => t.axis))];
  const key = a => { const l = ts.filter(t => t.axis === a); const r = Math.min(...l.map(t => t.run ?? Infinity)); return [r, Math.min(...l.map(t => P.tests.indexOf(t))), AXES.indexOf(a)]; };

function renderComparePlot() {
  const sel = UI.compare; const tests = sel.tests.map(id => P.tests.find(t => t.id === id)).filter(Boolean);

  let rows = [];

    const f = specFileOf(t); if (!f) return; if (!kind) kind = f.kind; if (f.kind !== kind) return;
    const sess = sessionOf(t); const ctl = controlCol(f); const m = computeMetrics(t);
    const cols = f.cols.filter(c => { if (c.role === 'control-dup') return false; const r = m.rows.find(q => q.ch === c.ch && (c.role === 'control') === !!q.isControl); const sName = r?.sensorName; if (sel.sensor && c.role !== 'control' && sName !== sel.sensor) return false; if (sel.mode === 'control') return c.role === 'control'; if (sel.mode === 'inaxis') return c.role !== 'control' && !!r?.inAxis; if (sel.mode === 'cross') return c.role !== 'control' && r && !r.inAxis && r.axis; return true; });
    cols.forEach((c, ci) => {
      let y = c.data; if (sel.norm && ctl && c.role !== 'control') y = ratioSeries(f.x, c.data, ctl.data, f.kind === 'psd');
      const st = colStyle(sess, c);

      const r = m.rows.find(r => r.ch === c.ch && (c.role === 'control') === !!r.isControl);
      if (r) rows.push({ test: testTitle(t), chan: colLabel(sess, c), axis: r.inAxis ? 'drive' : r.isControl ? 'control' : (r.axis || '') + ' cross', ctl: m.control, r, kind });
    });
  }));
  const unit = kind === 'psd' ? (sel.norm ? 'Transmissibility √(PSD ratio) (×)' : 'PSD (g²/Hz)') : kind === 'srs' ? (sel.norm ? 'SRS ratio (×)' : 'SRS (g)') : (sel.norm ? 'Transmissibility (×)' : 'Acceleration (g)');

  const tb = $('#c-table'); if (!tb) return;
  if (!rows.length) { tb.innerHTML = '<div class="small muted">Select two or more tests on the left.</div>'; return; }
  if (kind === 'psd') tb.innerHTML = `<table class="tbl"><thead><tr><th>Test</th><th>Channel</th><th>Axis</th><th class="num">Control gRMS</th><th class="num">Channel gRMS</th><th class="num">Ratio</th><th class="num">Max T</th><th class="num">At (Hz)</th></tr></thead><tbody>` + rows.map(r => `<tr><td>${esc(r.test)}</td><td>${esc(r.chan)}</td><td>${r.axis}</td><td class="num">${fmt(r.ctl?.grms)}</td><td class="num">${fmt(r.r.grms)}</td><td class="num">${r.r.isControl ? '' : fmt(r.r.grmsRatio, 3)}</td><td class="num">${r.r.isControl ? '' : fmt(r.r.tmax, 3)}</td><td class="num">${r.r.isControl ? '' : fmtF(r.r.tmaxF)}</td></tr>`).join('') + '</tbody></table><div class="small muted" style="margin-top:6px">For a linear structure the ratio and the max transmissibility stay the same from -6 dB to full level. A ratio that changes with level points to a joint that slips or gaps.</div>';

    if (legend) legend.innerHTML += `<div><span class="sw" style="background:${x.color}"></span><strong>${x.id === 'CTRL' ? 'C' : '#' + x.pos}</strong> ${esc(x.name)} <span class="muted">· in ${esc(chs)}</span></div>`;
  }
}

/* ===== Init, global events, project save/load, embedded data ===== */
function migrateProject(obj) {
  if (!Array.isArray(obj.campaigns)) obj.campaigns = [];
  (obj.sessions || []).forEach(migrateSession);
  siteMigrate(obj);
  // generic upgrade of projects saved by builds before v2.7 (sites can do more in siteMigrate)
  if (!obj.v27) {
    const pr = obj.profiles = obj.profiles || {}; if (!Array.isArray(pr.library)) pr.library = defaultLibrary();
    for (const t of obj.tests || []) { if (t.hidden == null) t.hidden = false; if (!t.profile) t.profile = 'full'; if (t.levelDb === undefined) t.levelDb = null; }
    for (const f of obj.files || []) { if (f.cols) splitLimitColumns(f); if (f.kind === 'rms' && f.cols) cleanHistory(f); }
    for (const s of obj.sessions || []) if (s.rotation == null) s.rotation = 0;
    obj.v25 = obj.v27 = obj.v272 = true;
  }
  return obj;
}
async function gzipText(txt) { if (typeof CompressionStream === 'undefined') return null; const cs = new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip')); return await new Response(cs).blob(); }
async function gunzipBlob(blob) { return await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).text(); }
async function saveProjectFile() {
  P.app = APP.name + ' ' + APP.version; const json = JSON.stringify(P);
  // compressed by default (about a quarter of the size); Load project reads both .json and .json.gz
  let blob = await gzipText(json); let ext = '.json.gz'; if (!blob) { blob = new Blob([json], { type: 'application/json' }); ext = '.json'; }
  const filename = (P.name || 'vibescope').replace(/[^\w.-]+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + ext;
  // Hosted viewer: go through the downloads capability (viewer confirms). Local file: plain download.
  if (window.claude && typeof window.claude.use === 'function') {
    try { const dl = await window.claude.use('downloads'); if (dl) { await dl.save({ filename, data: blob }); toast('Project saved (' + (blob.size / 1e6).toFixed(1) + ' MB)'); return; } }
    catch (e) { if (e && e.code === 'declined') return; toast('Save did not go through: ' + (e?.message || e), true); return; }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Project file saved (' + (blob.size / 1e6).toFixed(1) + ' MB)');
}
async function loadProjectFile(file) {
  try { const head = new Uint8Array(await file.slice(0, 2).arrayBuffer()); const gz = head[0] === 0x1f && head[1] === 0x8b; if (gz && typeof DecompressionStream === 'undefined') throw new Error('This browser cannot open compressed project files; use Chrome or Edge'); const txt = gz ? await gunzipBlob(file) : await file.text(); const obj = JSON.parse(txt); if (!obj || !Array.isArray(obj.sessions) || !Array.isArray(obj.files)) throw new Error('Not a project file');
    migrateProject(obj);
    modal('Load project', `<p>"${esc(obj.name || file.name)}" has ${obj.sessions.length} session(s), ${obj.tests.length} tests and ${obj.files.length} files${obj.app ? ` (saved from ${esc(obj.app)})` : ''}.</p><p class="small muted">Merge adds its sessions next to the ones already here. Replace discards what is in this browser first.</p>`, [{ label: 'Cancel' }, { label: 'Merge into current', onClick: () => { mergeProject(obj); LF_CACHE.clear(); M_CACHE.clear(); persist(); render(); } }, { label: 'Replace current', primary: true, onClick: () => { P = obj; P.profiles = Object.assign(defaultProfiles(), P.profiles || {}); UI.sessionId = (P.sessions.find(s => !s.hidden) || P.sessions[0])?.id || null; for (const s of P.sessions) if (s.collapsed == null) s.collapsed = s.id !== UI.sessionId; UI.testId = null; UI.compare.tests = []; UI.chan = {}; LF_CACHE.clear(); M_CACHE.clear(); persist(); render(); } }]);
  } catch (e) { toast('Could not load: ' + e.message, true); }
}
function mergeProject(obj) {
  const idmap = {};
  for (const s of obj.sessions) { const n = { ...s, id: uid() }; idmap[s.id] = n.id; if (P.sessions.some(x => x.name === n.name)) n.name += ' (imported)'; P.sessions.push(n); }
  for (const t of obj.tests) { const n = { ...t, id: uid(), sessionId: idmap[t.sessionId] || t.sessionId, fileIds: [] }; idmap[t.id] = n.id; P.tests.push(n); }
  for (const f of obj.files) { const n = { ...f, id: uid(), sessionId: idmap[f.sessionId] || f.sessionId, testId: idmap[f.testId] || null }; P.files.push(n); if (n.testId) { const t = P.tests.find(t => t.id === n.testId); if (t) t.fileIds.push(n.id); } }
}
function applyTheme(t) { UI.theme = t; if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); try { localStorage.setItem('vv-theme', t || ''); } catch (e) { } }
function currentThemeIsDark() { const t = document.documentElement.getAttribute('data-theme'); if (t) return t === 'dark'; return matchMedia('(prefers-color-scheme: dark)').matches; }
function referenceHtml() {
  return `<p class="small muted">${APP.name} v${APP.version} (${APP.date})</p>
  <p><strong>Import.</strong> Drag the data exports (xlsx, csv or txt from your controller or DAQ) anywhere onto the page, or use Import files. The file name is read for run number, axis, test type and level, and files from the same run are grouped into one test. Anything the detector is not sure about is listed in Files for manual placement.</p>
  <p><strong>Sessions and tests.</strong> A session is one test campaign with one sensor arrangement. Right-click a session or test for rename, duplicate, delete, and more. Drag files from the Files tab onto a test in the left panel.</p>
  <p><strong>Sensors.</strong> The Sensors and 3D tab holds one row per accelerometer: location, brand, serial, the sensitivities entered in the controller, and which input numbers carry its X, Y and Z. The channel map is built from this table. Paste the lab's channel sheet, or start from a saved sensor template. Positions r, angle, z place the marker in the 3D view.</p>
  <p><strong>Channel check.</strong> Below the first mode the article moves with the table, so each channel's ratio to the control tells which sensor axis points along the shaker. The tool uses this to pick the drive channel of every sensor (no assumption that sensor X is test X), to flag channels that read noise or a wrong sensitivity, and to show whether the three axis runs are consistent.</p>
  <p><strong>Test view.</strong> With many sensors the plot starts with one line per sensor (its drive channel). Click chips to add or hide channels, double-click to show only one, and use the per-sensor grid (S, M, L = 3, 2, 1 plots per row) to see every axis of every sensor. Tables: per sensor, per channel, and resonance peaks. Use the camera icon on a plot to export it as PNG.</p>
  <p><strong>Reports.</strong> Drop the controller's .doc/.docx/.pdf report together with the data; it attaches to the test with the same run number and an Open report button appears in the test view. You can also paste a SharePoint link per test.</p>
  <p><strong>Compare.</strong> Overlay the same channel across levels (linearity), across axes, or across sessions (before and after a fix).</p>
  <p><strong>Signatures.</strong> Pick a reference low level sweep and the sweeps run after the qualification runs. For every channel the transmissibility peaks are matched and the frequency shift is shown against the limit; lost and new peaks and amplitude changes are flagged too. Sweeps from other sessions (the 23 Oct low level runs, say) can be compared as long as the inputs are the same.</p>
  <p><strong>Sharing.</strong> Everything is stored in this browser. Save project writes one JSON file with all data; a teammate opens the same tool and uses Load project. Keep the HTML file on the shared drive so everyone has the same version.</p>
  <p><strong>Hiding.</strong> Right-click a test or session (or use Hide in the test header) to hide check runs, runs done at the wrong level and faulty sets. They stay in the project and come back with "show hidden" at the bottom of the left panel. Tests are listed in run order.</p>
  <p><strong>Left panel.</strong> Tests are in run order; drag one onto another to reorder it within its axis group (or Move up / Move down in the menu; Reset manual order in the session menu goes back to run order). Ctrl/Cmd-click or Shift-click selects several tests for one right-click menu: add to compare, hide, copy, duplicate, delete. Ctrl+C / Ctrl+V copy test definitions between sessions. Ctrl+Z / Ctrl+Y (or the arrows in the top bar) undo and redo every change to sessions, tests, profiles and file assignments. The "hidden" box at the top of the panel shows the hidden tests and sessions. The ☰ button hides the panel to give the plots the full width.</p>
  <p><strong>Profiles.</strong> Profiles and settings holds a library of random PSDs and SRS curves with the controller's channel limits (input, level, band). Each random or SRS test points at the profile it was run against (Edit test), which sets the curve, tolerance lines and the limit lines on the per-sensor plots. Breakpoints paste straight from a spreadsheet. When the controller export carries its limit lines ("Limit N-Abort(f)"), those are used instead, since they show exactly what was entered.</p>
  <p><strong>Planning a session.</strong> Right-click a session, Plan runs: one line per axis such as "X: sig, 0, sig, sig, srs, sig". The slots are created in run order with the chosen profiles, and imported files fall into them (signature sweeps fill the planned signature slots in order). Sensor sets can be saved as templates and reused for another session; the 3D model is parametric (telescope, box or cylinder payload) and the payload can be rotated on the fixture.</p>
  ${typeof SITE_HISTORY !== 'undefined' ? SITE_HISTORY : ''}
  <p class="small muted">Shortcuts: <kbd>Esc</kbd> closes dialogs. <kbd>Ctrl</kbd>-click selects several files for dragging.</p>`;
}
function helpDialog() { guideDialog(0); }

async function boot() {
  try { const t = localStorage.getItem('vv-theme'); if (t) applyTheme(t); } catch (e) { }
  const saved = await idbGet('project');
  try { await inflateEmbedded(); } catch (e) { console.error('bundled data', e); }
  let added = [];
  if (saved && saved.sessions) {
    P = migrateProject(saved); P.profiles = Object.assign(defaultProfiles(), P.profiles || {});
    // adding bundled sessions must never stop the app from starting
    try { added = addMissingBundled(); if (added.length) persist(); } catch (e) { console.error('bundled sessions', e); setTimeout(() => toast('Could not add the bundled sessions to the saved project: ' + (e?.message || e) + '. Use Reload bundled sessions in Profiles and settings.', true), 500); }
  }
  else { P = newProject(); try { loadEmbedded(); } catch (e) { console.error('embedded', e); } persist(); }
  siteAfterBundled(added);
  if (!P.sessions.some(s => s.id === UI.sessionId && (!s.hidden || UI.showHidden))) UI.sessionId = visibleSessions()[0]?.id || P.sessions[0]?.id || null;
  // the left panel starts with only the active session open
  for (const s of P.sessions) if (s.collapsed == null) s.collapsed = s.id !== UI.sessionId;
  // events
  $$('#tabs .tab').forEach(b => b.onclick = () => { UI.tab = b.dataset.tab; render(); $('#view').scrollTop = 0; $('#sidebar').classList.remove('open'); });
  $('#btn-import').onclick = () => $('#file-input').click();
  $('#file-input').onchange = e => { const rv = e.target.dataset.review === '1'; e.target.dataset.review = ''; importFiles(e.target.files, null, { review: rv }); e.target.value = ''; };
  $('#btn-save').onclick = saveProjectFile;
  $('#btn-load').onclick = () => $('#proj-input').click();
  $('#proj-input').onchange = e => { if (e.target.files[0]) loadProjectFile(e.target.files[0]); e.target.value = ''; };
  $('#btn-theme').onclick = () => { applyTheme(currentThemeIsDark() ? 'light' : 'dark'); render(); };
  $('#btn-undo').onclick = undo; $('#btn-redo').onclick = redo;
  document.addEventListener('keydown', e => {
    if (inEditable(e.target) || $('#modal').classList.contains('show')) return;
    const mod = e.ctrlKey || e.metaKey; const k = e.key.toLowerCase();
    if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((mod && k === 'y') || (mod && k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
    else if (mod && k === 'c' && UI.sel.size) { e.preventDefault(); copyTests([...UI.sel].map(id => P.tests.find(t => t.id === id)).filter(Boolean)); }
    else if (mod && k === 'v' && UI.clip.length) { e.preventDefault(); pasteTests(activeSession()); }
    else if (k === 'escape' && UI.sel.size) { UI.sel.clear(); renderTree(); }
  });
  $('#btn-help').onclick = helpDialog;
  $('#company').onclick = brandDialog;
  $('#btn-menu').onclick = () => { if (innerWidth <= 760) $('#sidebar').classList.toggle('open'); else { const c = $('#body').classList.toggle('sb-collapsed'); try { localStorage.setItem('vv-sb', c ? '1' : ''); } catch (e) { } setTimeout(() => { for (const el of livePlots.values()) { try { Plotly.Plots.resize(el); } catch (e) { } } }, 50); } };
  try { if (localStorage.getItem('vv-sb') === '1') $('#body').classList.add('sb-collapsed'); } catch (e) { }
  $('#btn-new-session').onclick = () => UI.treeMode === 'campaign' ? newCampaignDialog([]) : editSessionDialog(null);
  $('#btn-new-test').onclick = () => editTestDialog(null);
  $('#btn-autobuild').onclick = () => { const s = activeSession(); if (!s) { toast('Create a session first', true); return; } if (!buildStandardMatrix(s.id)) toast('Standard matrix already present'); persist(); render(); };
  $('#modal-x').onclick = closeModal; $('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
  // sidebar resize
  const db = $('#dragbar'); db.onmousedown = e => { e.preventDefault(); db.classList.add('active'); const mv = ev => { document.documentElement.style.setProperty('--sidebar-w', clamp(ev.clientX, 200, 560) + 'px'); }; const up = () => { db.classList.remove('active'); removeEventListener('mousemove', mv); removeEventListener('mouseup', up); try { localStorage.setItem('vv-sidebar', getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w')); } catch (e) { } }; addEventListener('mousemove', mv); addEventListener('mouseup', up); };
  try { const w = localStorage.getItem('vv-sidebar'); if (w) document.documentElement.style.setProperty('--sidebar-w', w); } catch (e) { }
  // global drag and drop of files
  let dragDepth = 0; const gd = $('#globaldrop');
  addEventListener('dragenter', e => { if (e.dataTransfer?.types?.includes('Files')) { dragDepth++; gd.classList.add('show'); } });
  addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) gd.classList.remove('show'); });
  addEventListener('dragover', e => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
  addEventListener('drop', e => { dragDepth = 0; gd.classList.remove('show'); if (e.dataTransfer?.files?.length && !e.target.closest('.tnode,#dz')) { e.preventDefault(); importFiles(e.dataTransfer.files); } });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render());
  $('#ver').textContent = 'v' + APP.version; document.title = APP.name + ' v' + APP.version;
  historyInit();

  siteBootNotice(added);
}
